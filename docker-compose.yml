services:
  postgres:
    image: postgres:16-alpine
    container_name: templecourts-db
    environment:
      POSTGRES_USER: templecourts
      POSTGRES_PASSWORD: templecourts_dev
      POSTGRES_DB: templecourts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U templecourts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
